<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MBOS WhatsApp Message</title>

<style>
body{
    font-family:Arial;
    max-width:700px;
    margin:40px auto;
    line-height:1.6;
}

textarea{
    width:100%;
    height:300px;
    font-size:16px;
    padding:15px;
}

button{
    padding:12px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>

</head>

<body>

<h2>MBOS WhatsApp Message</h2>

<textarea id="msg"></textarea>

<br><br>

<button onclick="copyText()">Copy Message</button>

<script>

const params = new URLSearchParams(window.location.search);

const name = params.get("name") || "Customer";
const order = params.get("order") || "";

document.getElementById("msg").value =
`Hi ${name},

Thank you for your order ${order} with mbellish.

We've received your order and will begin processing it shortly.

We'll keep you updated as your order progresses.

If you have any questions, simply reply to this message.

Thank you for choosing mbellish!`;

function copyText(){

const txt=document.getElementById("msg");

txt.select();

navigator.clipboard.writeText(txt.value);

alert("Copied!");

}

</script>

</body>
</html>
